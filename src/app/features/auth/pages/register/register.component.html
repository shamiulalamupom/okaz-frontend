<section class="bg-blue-500 min-h-screen flex items-center">
  <div class="max-w-6xl mx-auto w-full px-6 grid md:grid-cols-2 gap-12 items-center">

    <!-- LEFT SIDE -->
    <div class="text-white max-w-md">
      <h2 class="text-4xl font-bold leading-tight">
        Get what you want,<br />
        delivered simply
      </h2>

      <p class="mt-4 text-base text-white/80">
        Shop essentials, manage orders, and track your account in one place.
      </p>
    </div>

    <!-- RIGHT SIDE (FORM CARD) -->
    <div class="bg-white p-8 rounded-2xl shadow-lg w-full max-w-md mx-auto">

      <h3 class="text-xl font-semibold mb-1">
        Create Account
      </h3>

      <p class="text-sm text-gray-500 mb-6">
        Sign up to get started
      </p>

      <form class="space-y-4">

        <div> <label class="block text-sm mb-1 font-medium">Full Name</label> 
        <input 
        type="text" 
        placeholder="Enter your name" 
        class="w-full px-3 py-2.5 rounded-md bg-gray-100 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500" 
        /> </div>

        <!-- EMAIL -->
        <div>
          <label class="block text-sm mb-1 font-medium">Email</label>
          <input
            type="email"
            placeholder="Enter your email"
            class="w-full px-3 py-2.5 rounded-md bg-gray-100 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <!-- PASSWORD -->
        <div>
          <label class="block text-sm mb-1 font-medium">Password</label>
          <input
            type="password"
            placeholder="Enter your password"
            class="w-full px-3 py-2.5 rounded-md bg-gray-100 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div> 
        <label class="text-xs text-black">Confirm Password</label> 
        <input
            type="password" 
            placeholder="Re-enter your password" 
            class="w-full px-3 py-2.5 rounded-md bg-gray-100 border border-gray-200 focus:outline-none focus:ring-2 focus:ring-blue-500" 
        /> 
        </div>

        <!-- BUTTON -->
        <button
          type="submit"
          class="w-full bg-blue-600 text-white py-2.5 rounded-md font-semibold hover:bg-blue-700 transition"
        >
            Sign Up
        </button>
      </form>

      <!-- FOOTER -->
      <p class="text-sm text-gray-600 mt-6 text-center">
        Don’t have an account?
        <a href="#" class="text-blue-600 font-medium hover:underline">
          Sign up
        </a>
      </p>

    </div>

  </div>
</section>
