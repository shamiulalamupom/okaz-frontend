<section class="auth-page"><div class="min-h-screen bg-[#A4F4DC] flex items-center justify-center px-6 font-[Poppins]">
  <section class="w-full max-w-6xl flex items-start justify-center gap-20">
    <div class="max-w-[320px]">
  <h1 class="text-3xl font-semibold leading-tight">
    Get what you want,<br />
    delivered simply
  </h1>


      <p class="m-0 max-w-[420px] text-[15px] leading-[1.55] font-medium text-black">
        Shop essentials, manage orders, and track your account in one place.
      </p>
    </div>

    <div class="w-[217px] bg-[#f3f3f3] mt-10 px-[15px] pt-[14px] pb-6 shadow-[0_2px_7px_rgba(0,0,0,0.22)]">
      <h2 class="m-0 text-[18px] leading-[1.2] font-bold text-black">
        Create Account
      </h2>

      <p class="mt-1 mb-3 text-[10px] font-normal text-[#222]">
        Sign up to get started
      </p>

      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col">
        <label class="mt-[9px] mb-1 text-[11px] font-normal text-black">
          Full Name
        </label>
        <input
          type="text"
          formControlName="name"
          placeholder="Enter your name"
          class="w-[148px] h-[21px] border-none outline-none bg-[#d9d9d9] px-[7px] text-[10px] text-black placeholder:text-[#111]"
        />

        <label class="mt-[9px] mb-1 text-[11px] font-normal text-black">
          Email :
        </label>
        <input
          type="email"
          formControlName="email"
          placeholder="Enter your email"
          class="w-[148px] h-[21px] border-none outline-none bg-[#d9d9d9] px-[7px] text-[10px] text-black placeholder:text-[#111]"
        />

        <label class="mt-[9px] mb-1 text-[11px] font-normal text-black">
          Password
        </label>
        <input
          type="password"
          formControlName="password"
          placeholder="Enter your password"
          class="w-[148px] h-[21px] border-none outline-none bg-[#d9d9d9] px-[7px] text-[10px] text-black placeholder:text-[#111]"
        />
        <label class="mt-[9px] mb-1 text-[11px] font-normal text-black">
         Confirm password
        </label>
        <input
        type="password"
        formControlName="confirmPassword"
        placeholder="Re-enter your password"
        class="w-[148px] h-[21px] border-none outline-none bg-[#d9d9d9] px-[7px] text-[10px] text-black placeholder:text-[#111]"/>

        <button
          type="submit"
          [disabled]="isSubmitting()"
          class="mt-[21px] w-[62px] h-[26px] border-none bg-[#1e90ff] text-black text-[11px] font-bold cursor-pointer shadow-[0_2px_4px_rgba(0,0,0,0.28)]"
        >
          Sign up
        </button>
      </form>

      @if (errorMessage()) {
        <p class="mt-2 text-[10px] text-red-600">
          {{ errorMessage() }}
        </p>
      }

      <p class="mt-[18px] text-[10px] font-normal text-black">
        Already have an account?
        <a routerLink="/login" class="text-blue-600 no-underline">log in</a>
      </p>
    </div>
  </section>
</div></section>
