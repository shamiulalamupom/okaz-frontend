<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Meta configuration for character encoding -->
  <meta charset="UTF-8">
  <!-- Responsive design for mobile devices -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Signup</title>
  <!-- Import TailwindCSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<!-- Body with light gray background -->
<body class="bg-gray-100">

  <!-- Navigation bar at the top -->
  <nav class="flex justify-between items-center px-10 py-4 bg-gray-200">
    <!-- Logo / Brand name -->
    <div class="text-xl font-bold">OKAZ</div>

    <!-- Navigation links -->
    <div class="space-x-8 font-semibold">
      <a href="#" class="hover:text-blue-500">Home</a>
      <a href="#" class="hover:text-blue-500">Product</a>
      <a href="#" class="hover:text-blue-500">Account</a>
    </div>
  </nav>

  <!-- Main section with blue background and full height -->
  <div class="flex items-center justify-between px-20 py-20 bg-blue-400 min-h-screen">
    
    <!-- Left text content (marketing message) -->
    <div class="max-w-md text-black">
      <h1 class="text-3xl font-bold mb-4">Get what you want ,<br> delivered simply</h1>
      <p class="text-sm">Shop essentials, manage orders, and track your account in one place.</p>
    </div>

    <!-- Signup card container -->
    <div class="bg-white p-6 rounded shadow-md w-80">
      <!-- Card title -->
      <h2 class="text-lg font-semibold">Create Account</h2>
      <p class="text-xs text-gray-500 mb-4">Sign up to get started</p>

      <!-- Signup form -->
      <form class="space-y-3">

        <!-- Full name input field -->
        <div>
          <label class="text-sm">Full Name</label>
          <input type="text" placeholder="Enter your name" class="w-full mt-1 p-2 bg-gray-200 text-sm outline-none">
        </div>

        <!-- Email input field -->
        <div>
          <label class="text-sm">Email :</label>
          <input type="email" placeholder="Enter your email" class="w-full mt-1 p-2 bg-gray-200 text-sm outline-none">
        </div>

        <!-- Password input field -->
        <div>
          <label class="text-sm">Password</label>
          <input type="password" placeholder="Enter your password" class="w-full mt-1 p-2 bg-gray-200 text-sm outline-none">
        </div>

        <!-- Confirm password input field -->
        <div>
          <label class="text-sm">Confirm password</label>
          <input type="password" placeholder="Re-enter your password" class="w-full mt-1 p-2 bg-gray-200 text-sm outline-none">
        </div>

        <!-- Submit button -->
        <button class="w-full bg-blue-600 text-white py-2 mt-2">Sign up</button>
      </form>

      <!-- Redirect to login page -->
      <p class="text-xs text-gray-600 mt-4">
        Already have an account? 
        <a href="#" class="text-blue-600">Log in</a>
      </p>
    </div>

  </div>

</body>
</html>
