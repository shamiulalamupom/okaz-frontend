
  <!-- 1. Import TailwindCSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>


<!-- 2. Page body with white background -->

  <!-- 3. Header with logo and navigation -->
  <header class="flex justify-between items-center px-8 py-4 border-b">
    <h1 class="text-xl font-bold">OKAZ</h1>


  <!-- 5. Main section with blue background -->
  <section class="bg-blue-400 min-h-screen flex items-center justify-between px-16">

    <!-- 6. Left text block -->
    <div class="text-black max-w-md">
      <h2 class="text-3xl font-bold mb-4">
        Get what you want , <br> delivered simply
      </h2>

      <p class="text-sm">
        Shop essentials, manage orders, and track your account in one place.
      </p>
    </div>

    <!-- 7. Login form card -->
    <div class="bg-white p-6 w-80 shadow-lg">
      <h3 class="text-lg font-bold mb-1">Welcome Back</h3>

      <!-- 8. Form subtitle -->
      <p class="text-sm text-gray-500 mb-4">Log into your account</p>

      <!-- 9. Login form -->
      <form class="space-y-3">

        <!-- Email field -->
        <div>
          <label class="text-sm">Email :</label>
          <input type="email" placeholder="Enter your email"
            class="w-full mt-1 p-2 bg-gray-200 text-sm outline-none">
        </div>

        <!-- Password field -->
        <div>
          <label class="text-sm">Password</label>
          <input type="password" placeholder="Enter your password"
            class="w-full mt-1 p-2 bg-gray-200 text-sm outline-none">
        </div>

        <!-- 10. "Forgot password" link -->
        <div class="text-sm text-blue-600 cursor-pointer">
          Forgot password?
        </div>

        <!-- Login button -->
        <button class="bg-blue-600 text-white px-4 py-2 text-sm font-semibold">
          Log In
        </button>
      </form>

      <!-- Sign up link -->
      <p class="text-sm mt-4">
        Dont have an account?
        <a href="#" class="text-blue-600">Sign up</a>
      </p>
    </div>

  </section>
